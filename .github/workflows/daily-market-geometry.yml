name: Daily Market Geometry Refresh

on:
  schedule:
    - cron: "45 23 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build latest dashboard snapshot
        shell: bash
        run: |
          set -e
          for attempt in 1 2 3; do
            echo "Snapshot build attempt $attempt of 3"
            if python research/build_dashboard_snapshot.py; then
              exit 0
            fi

            if [ "$attempt" -lt 3 ]; then
              echo "Build failed. Waiting 30 seconds before retry..."
              sleep 30
            fi
          done

          echo "Snapshot build failed after 3 attempts."
          exit 1

      - name: Commit updated snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/dashboard_snapshot.json

          if git diff --cached --quiet; then
            echo "No snapshot changes to commit."
            exit 0
          fi

          git commit -m "Update daily market geometry snapshot"
          git push
