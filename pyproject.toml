[project]
name = "market-geometry-monitor"
version = "0.2.0"
description = "Daily evolving-SVD market geometry and degeneracy monitor"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.141.1",
  "numpy>=1.26",
  "pandas>=2.2",
  "yfinance>=0.2.65"
]

[tool.setuptools]
packages = ["market_geometry"]
